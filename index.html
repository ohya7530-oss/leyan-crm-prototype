<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4f7fb"><title>樂衍｜客戶與業務管理測試版</title>
<style>
:root{--navy:#152841;--blue:#315f91;--sky:#e8f1fa;--ink:#1d2b3d;--muted:#708096;--line:#e3eaf1;--bg:#f4f7fb;--white:#fff;--orange:#e88b48;--green:#2e806d;--red:#b44b4b;--shadow:0 8px 28px #20344d12}*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}.top{background:var(--navy);color:#fff;padding:14px max(18px,calc((100vw - 1180px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:750;font-size:18px}.brand small{display:block;color:#bac9d9;font-size:11px;font-weight:400}.userbar{display:flex;align-items:center;gap:9px}.userbar select{background:#233a56;color:#fff;border:1px solid #51677f;border-radius:9px;padding:8px}.wrap{max-width:1180px;margin:0 auto;padding:24px 18px 60px}.notice{background:#fff5df;border:1px solid #f1d9a2;color:#73551b;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:18px}.nav{display:flex;gap:8px;overflow:auto;margin-bottom:20px}.nav button{border:0;border-radius:10px;padding:10px 15px;background:#e8edf3;color:#40546a;white-space:nowrap;min-height:46px;touch-action:manipulation}.nav button.active{background:var(--blue);color:white}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 18px}.head h1{font-size:25px;margin:0;color:var(--navy)}.sub{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:var(--white);border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:var(--shadow)}.span3{grid-column:span 3}.span4{grid-column:span 4}.span5{grid-column:span 5}.span6{grid-column:span 6}.span7{grid-column:span 7}.span8{grid-column:span 8}.span12{grid-column:span 12}.stat{font-size:28px;font-weight:750;color:var(--navy);margin-top:4px}.label{font-size:12px;color:var(--muted)}h2{font-size:17px;color:var(--navy);margin:0 0 12px}h3{font-size:14px;margin:0 0 8px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.tag{display:inline-block;font-size:11px;border-radius:20px;padding:3px 9px;background:var(--sky);color:var(--blue);white-space:nowrap}.tag.orange{background:#fff0e2;color:#9b5e25}.tag.green{background:#e6f4ef;color:#28745f}.tag.red{background:#fbeaea;color:#9b3838}.btn{border:0;border-radius:9px;padding:9px 13px;background:var(--blue);color:#fff}.btn.light{background:#edf3f8;color:#294766}.btn.ghost{background:transparent;color:var(--blue);padding:7px}.btn:disabled{opacity:.45;cursor:not-allowed}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:#5d6c7e}.field input,.field textarea,.field select,.search{padding:10px 11px;border:1px solid #d8e1ea;border-radius:9px;background:white;color:var(--ink);width:100%;min-height:46px;font-size:16px;touch-action:manipulation}.field textarea{min-height:94px;resize:vertical}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}.chips{display:flex;gap:7px;flex-wrap:wrap}.pill{padding:6px 10px;border-radius:20px;background:#f0f4f8;font-size:12px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:620px}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-weight:600}.hidden{display:none!important}.muted{color:var(--muted)}.empty{padding:24px;text-align:center;color:var(--muted)}.report{background:white;padding:24px;border-radius:14px;border:1px solid var(--line)}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:white;padding:10px 16px;border-radius:24px;display:none;z-index:20}.safe{font-size:12px;color:#805b1a;background:#fff6e6;border-radius:8px;padding:8px 10px;margin-top:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.seg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.seg button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;color:#40546a}.seg button.active{border-color:var(--blue);color:var(--blue);background:var(--sky)}
@media(max-width:760px){.wrap{padding:14px 10px 44px}.span3,.span4,.span5,.span6,.span7,.span8{grid-column:span 12}.head{align-items:flex-start;flex-direction:column}.top{padding:10px;align-items:flex-start;flex-wrap:wrap}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.stat{font-size:24px}.card{padding:13px}.userbar label{display:none}.brand{font-size:16px}.nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));overflow:visible;gap:7px}.nav button{white-space:normal;padding:11px 7px;font-size:14px}.btn{min-height:46px;padding:11px 14px}.btn.ghost{min-height:44px}.row{flex-wrap:wrap}.actions .btn{flex:1 1 140px}.notice{font-size:12px}.report{padding:14px}}
@media print{body{background:white}.top,.nav,.notice,.no-print,.actions{display:none!important}.wrap{max-width:none;padding:0}.card,.report{box-shadow:none;border:0}.hidden{display:none!important}}
</style></head><body>
<header class="top"><div class="brand">樂衍｜客戶管理<span><small>V1 測試原型 · 僅限假資料</small></span></div><div class="userbar"><label for="role">測試身份</label><select id="role"><option value="staff-a">業務人員 A</option><option value="staff-b">業務人員 B</option><option value="admin">管理者（唯讀）</option></select></div></header>
<main class="wrap"><div class="notice">測試環境：資料僅存在此瀏覽器的 localStorage。手機請先下載檔案，再用 Safari／Chrome 開啟，不要在 Telegram 內建預覽操作。請勿輸入真實客戶資料；角色切換只是介面示範，不是真正登入或安全權限控管。</div>
<nav class="nav" id="nav"><button data-page="home" class="active">今日總覽</button><button data-page="records">工作紀錄</button><button data-page="customers">客戶搜尋</button><button data-page="reports">工作報告</button><button data-page="templates">LINE 範本</button></nav>
<section id="page-home"></section><section id="page-records" class="hidden"></section><section id="page-customers" class="hidden"></section><section id="page-reports" class="hidden"></section><section id="page-templates" class="hidden"></section></main><div class="toast" id="toast"></div>
<script>
(function(){'use strict';
const KEY='leyan-customer-demo-v1';
const today=()=>new Date().toISOString().slice(0,10);
const seed=[
{id:'r1',owner:'staff-a',type:'維護服務',customer:'晴禾牙醫診所',date:today(),follow:today(),title:'工程',content:'診間主機偶發重開；初步檢查電源線與散熱，需安排工程師到場確認。',askPerson:'',askMethod:'',status:'待追蹤',importance:'重要且緊急',created:Date.now()},
{id:'r2',owner:'staff-b',type:'業務組工作日誌',customer:'沐光牙醫',date:today(),follow:'',title:'業務客服',content:'院長希望了解診所開業整合服務與系統導入流程。',askPerson:'',askMethod:'',status:'進行中',importance:'重要不緊急',created:Date.now()},
{id:'r3',owner:'staff-a',type:'個人紀錄',customer:'（無客戶）',date:today(),follow:'',title:'內勤',content:'整理本週拜訪安排；確認下週拜訪時段。',askPerson:'',askMethod:'',status:'待處理',importance:'緊急不重要',created:Date.now()},
{id:'r4',owner:'staff-a',type:'維護服務',customer:'晴禾牙醫診所',date:new Date(Date.now()-86400000*18).toISOString().slice(0,10),follow:'',title:'工程',content:'診間印表機卡紙；清潔滾輪後恢復，請持續觀察。',askPerson:'',askMethod:'',status:'已完成',importance:'不重要不緊急',created:Date.now()-86400000*18},
{id:'r5',owner:'staff-b',type:'業務組工作日誌',customer:'安和聯合診所',date:new Date(Date.now()-86400000*43).toISOString().slice(0,10),follow:'',title:'開業顧問',content:'服務方案說明：已提供初步方案，等待回覆。',askPerson:'',askMethod:'',status:'追蹤中',importance:'重要不緊急',created:Date.now()-86400000*43}
];
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return Array.isArray(x)?x:seed.slice()}catch(e){return seed.slice()}}
let records=load(),role='staff-a',page='home',selectedCustomer='',templateRecordId='';
function save(){try{localStorage.setItem(KEY,JSON.stringify(records))}catch(e){toast('本機儲存失敗；請勿輸入真實資料')}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function visible(){return role==='admin'?records:records.filter(r=>r.owner===role)}
function canEdit(r){return role!=='admin'&&r.owner===role}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',2200)}
function badge(s){const cls=s==='待追蹤'||s==='待處理'?'orange':s==='已完成'?'green':' ';return '<span class="tag '+cls+'">'+esc(s)+'</span>'}
function header(title,sub,button){return '<div class="head"><div><h1>'+title+'</h1><div class="sub">'+sub+'</div></div>'+(button||'')+'</div>'}
function recordRow(r){const ask=(r.askPerson||r.askMethod)?'<div class="sub">詢問：'+esc(r.askPerson||'未填')+' · '+esc(r.askMethod||'未選')+'</div>':'';return '<div class="row"><div><strong>'+esc(r.customer)+'</strong><div class="sub">'+esc(r.date)+' · '+esc(r.title)+'</div><div class="sub">'+esc(r.type)+' · '+esc(r.importance||'未分類')+'</div>'+ask+'</div><div>'+badge(r.status)+(canEdit(r)?'<button class="btn ghost" data-edit="'+esc(r.id)+'">編輯</button><button class="btn light" data-make-template="'+esc(r.id)+'">LINE 範本</button>':'')+'</div></div>'}
function renderHome(){const rs=visible(),due=rs.filter(r=>r.follow&&r.follow<=today()&&r.status!=='已完成'),todayRs=rs.filter(r=>r.date===today());document.getElementById('page-home').innerHTML=header('今日總覽','今天的工作、追蹤事項與客戶狀況',role==='admin'?'<span class="tag">管理者檢視｜唯讀</span>':'<button class="btn" data-goto="records">＋ 新增紀錄</button>')+'<div class="grid"><div class="card span3"><div class="label">今日紀錄</div><div class="stat">'+todayRs.length+'</div></div><div class="card span3"><div class="label">待追蹤</div><div class="stat">'+due.length+'</div></div><div class="card span3"><div class="label">進行中業務</div><div class="stat">'+rs.filter(r=>r.type==='業務組工作日誌'&&r.status!=='已完成').length+'</div></div><div class="card span3"><div class="label">待入會案件</div><div class="stat">2</div><div class="sub">測試資料</div></div><div class="card span7"><h2>今日工作與待辦</h2>'+(due.length?due.map(recordRow).join(''):'<div class="empty">目前沒有到期追蹤事項</div>')+'<h2 style="margin-top:16px">近期紀錄</h2>'+(rs.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4).map(recordRow).join('')||'<div class="empty">尚無紀錄</div>')+'</div><div class="card span5"><h2>今日行事曆</h2><div class="safe">測試示意，不連接 Google Calendar</div><div class="row"><span>09:30　客戶拜訪</span><span class="tag">示意</span></div><div class="row"><span>14:00　維修案件追蹤</span><span class="tag orange">待辦</span></div><h2 style="margin-top:18px">今日待處理問題</h2><div class="sub">'+(due.length?due.map(r=>esc(r.customer)+'：'+esc(r.title)).join('<br>'):'目前沒有待處理問題')+'</div><div class="safe">使用假資料示範，請勿輸入真實客戶資訊。</div></div></div>'}
function renderRecords(){const rs=visible();document.getElementById('page-records').innerHTML=header('工作紀錄','新增與管理客戶、維修、業務及個人紀錄',role==='admin'?'<span class="tag">管理者唯讀，不能新增或編輯</span>':'')+(role==='admin'?'':'<div class="card" style="margin-bottom:14px"><h2 id="form-title">新增紀錄</h2><form id="recordForm" class="form"><div class="field"><label>紀錄類型</label><select name="type"><option>維護服務</option><option>業務組工作日誌</option><option>個人紀錄</option></select></div><div class="field"><label>診所／客戶名稱</label><input name="customer" required maxlength="80" placeholder="測試名稱，例如晴禾牙醫"></div><div class="field"><label>建立日期</label><input name="date" type="date" value="'+today()+'" required></div><div class="field"><label>追蹤日期（選填）</label><input name="follow" type="date"></div><div class="field"><label>標題</label><select name="title" required><option value="業務客服" selected>業務</option><option value="內勤">內勤</option><option value="培訓">培訓</option><option value="工程">工程</option><option value="行銷">行銷</option><option value="開業顧問">開業顧問</option></select></div><div class="field inquiry-field"><label>詢問人員</label><input name="askPerson" maxlength="80" placeholder="可留空，或輸入人員名稱"></div><div class="field inquiry-field"><label>詢問方式</label><select name="askMethod" required><option value="">請選擇</option><option value="電話">電話</option><option value="傳訊">傳訊</option><option value="現場">現場</option></select></div><div class="field full"><label>處理內容</label><textarea name="content" maxlength="2000" required placeholder="請使用測試資料"></textarea></div><div class="field"><label>AI 建議分類</label><select name="importance"><option>重要且緊急</option><option>重要不緊急</option><option>緊急不重要</option><option>不重要不緊急</option></select></div><div class="field"><label>分類方式</label><div class="sub">目前為測試規則建議，送出前可自行調整分類。</div></div><div class="actions field full"><button class="btn" type="submit">儲存測試紀錄</button><button class="btn light" type="reset">清除表單</button></div></form><div class="safe">分類為測試示意，並非已串接 AI；表單資料只存在此瀏覽器。</div></div>')+'<div class="card"><h2>紀錄清單 <span class="tag">'+rs.length+' 筆</span></h2>'+(rs.length?rs.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(recordRow).join(''):'<div class="empty">沒有可顯示的紀錄</div>')+'</div>'}
function renderCustomers(){const rs=visible();const names=[...new Set(rs.map(r=>r.customer).filter(n=>n&&n!=='（無客戶）'))];const match=selectedCustomer?rs.filter(r=>r.customer===selectedCustomer):[];document.getElementById('page-customers').innerHTML=header('客戶搜尋','確認診所後查看最近三個月紀錄')+'<div class="card"><div class="field"><label>輸入診所／客戶名稱</label><input id="customerSearch" class="search" placeholder="搜尋測試客戶" value="'+esc(selectedCustomer)+'"></div><div class="chips" style="margin:12px 0">'+names.filter(n=>!selectedCustomer||n.toLowerCase().includes(selectedCustomer.toLowerCase())).map(n=>'<button class="btn light" data-customer="'+esc(n)+'">'+esc(n)+'</button>').join('')+'</div>'+(selectedCustomer?'<h2>已選擇：'+esc(selectedCustomer)+'</h2>'+match.filter(r=>r.date>=new Date(Date.now()-90*86400000).toISOString().slice(0,10)).sort((a,b)=>b.date.localeCompare(a.date)).map(r=>'<details class="row"><summary>'+esc(r.date)+'　'+esc(r.title)+'　'+badge(r.status)+'</summary><p>'+esc(r.content)+'</p><div class="sub">'+esc(r.type)+' · '+esc(r.owner)+'</div></details>').join('')||'<div class="empty">近三個月沒有紀錄</div>':'<div class="sub">輸入後選擇正確客戶名稱。</div>')+'</div>'}
function renderTemplates(){const rs=visible();const r=rs.find(x=>x.id===templateRecordId)||rs[0];const body=r?(r.customer+'的'+(r.title||'業務')+'紀錄：'+r.content+'。詢問方式：'+(r.askMethod||'未填')+'；需要協助安排後續處理。'):'請先新增工作紀錄。';document.getElementById('page-templates').innerHTML=header('LINE 範本','從工作紀錄產生文字，可自行修改後複製；不會自動傳送 LINE。')+'<div class="card"><div class="field"><label>選擇工作紀錄</label><select id="templateRecord">'+rs.map(x=>'<option value="'+esc(x.id)+'" '+(r&&x.id===r.id?'selected':'')+'>'+esc(x.date+' · '+x.customer+' · '+x.title)+'</option>').join('')+'</select></div><div class="field" style="margin-top:12px"><label>可修改的範本文字</label><textarea id="templateText" maxlength="2000">'+esc(body)+'</textarea></div><div class="actions"><button class="btn" data-copy-template>複製範本</button><span class="safe">僅產生文字，不會自動傳送 LINE。</span></div></div>'}
function renderReports(){const rs=visible(),admin=role==='admin';const list=rs.slice().sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('page-reports').innerHTML=header(admin?'全體業務進度報告':'個人工作摘要','18:30 報告預覽 · 測試內容，不會自動傳送', '<button class="btn" onclick="window.print()">列印／另存 PDF</button>')+'<div class="report"><h1>'+(admin?'全體業務工作進度':'個人工作摘要')+'</h1><div class="sub">報告日期：'+today()+'　·　'+(admin?'管理者唯讀':'測試報告預覽')+'</div><hr><h2>工作紀錄摘要</h2>'+list.map(recordRow).join('')+'<h2 style="margin-top:20px">尚待追蹤</h2>'+list.filter(r=>r.follow&&r.status!=='已完成').map(r=>'<p>'+esc(r.follow)+'　'+esc(r.customer)+'｜'+esc(r.title)+'</p>').join('')+'<p class="safe">本報告由假資料產生。V1 測試不排程、不透過 Telegram 傳送。</p></div>'}
function syncInquiryFields(form){const personal=form.elements.type.value==='個人紀錄';form.querySelectorAll('.inquiry-field').forEach(el=>el.classList.toggle('hidden',personal));form.elements.askMethod.required=!personal}
function render(){renderHome();renderRecords();renderCustomers();renderReports();document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));['home','records','customers','reports','templates'].forEach(p=>document.getElementById('page-'+p).classList.toggle('hidden',p!==page));if(page==='templates')renderTemplates();const form=document.getElementById('recordForm');if(form)syncInquiryFields(form)}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(!b)return;page=b.dataset.page;render()});document.addEventListener('change',e=>{if(e.target.id==='templateRecord'){templateRecordId=e.target.value;renderTemplates()}});document.addEventListener('click',e=>{if(e.target.closest('[data-copy-template]')){const t=document.getElementById('templateText');if(t){navigator.clipboard.writeText(t.value).then(()=>toast('範本已複製')).catch(()=>{t.select();toast('請長按文字複製')})}}});document.getElementById('role').addEventListener('change',e=>{role=e.target.value;selectedCustomer='';render();toast('已切換測試身份：'+e.target.options[e.target.selectedIndex].text)});document.addEventListener('change',e=>{if(e.target.name==='type'){const form=e.target.closest('#recordForm');if(form)syncInquiryFields(form)}});
document.addEventListener('click',e=>{const mt=e.target.closest('[data-make-template]');if(mt){templateRecordId=mt.dataset.makeTemplate;page='templates';render();return}const g=e.target.closest('[data-goto]');if(g){page=g.dataset.goto;render();return}const c=e.target.closest('[data-customer]');if(c){selectedCustomer=c.dataset.customer;page='customers';render();return}const ed=e.target.closest('[data-edit]');if(ed){const r=records.find(x=>x.id===ed.dataset.edit);if(!r||!canEdit(r)){toast('此角色僅能查看');return}const f=document.getElementById('recordForm');if(!f)return;f.elements.type.value=r.type;f.elements.customer.value=r.customer;f.elements.date.value=r.date;f.elements.follow.value=r.follow;f.elements.title.value=(Array.from(f.elements.title.options).some(o=>o.value===r.title)?r.title:'內勤');f.elements.askPerson.value=r.askPerson||'';f.elements.askMethod.value=r.askMethod||'';f.elements.content.value=r.content;syncInquiryFields(f);f.elements.importance.value=r.importance;f.dataset.editing=r.id;syncInquiryFields(f);document.getElementById('form-title').textContent='編輯紀錄（測試）';f.querySelector('[type=submit]').textContent='儲存修改';window.scrollTo({top:0,behavior:'smooth'})}});
document.addEventListener('input',e=>{if(e.target.id==='customerSearch'){selectedCustomer=e.target.value;renderCustomers();const i=document.getElementById('customerSearch');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}});
document.addEventListener('submit',e=>{if(e.target.id!=='recordForm')return;e.preventDefault();if(role==='admin'){toast('管理者唯讀');return}const f=e.target,d=new FormData(f),id=f.dataset.editing;const prior=id?records.find(r=>r.id===id):null;const item={id:id||('r'+Date.now()),owner:role,type:d.get('type'),customer:d.get('customer').trim(),date:d.get('date'),follow:d.get('follow'),title:d.get('title'),askPerson:d.get('type')==='個人紀錄'?'':(d.get('askPerson')||'').trim(),askMethod:d.get('type')==='個人紀錄'?'':(d.get('askMethod')||''),content:d.get('content').trim(),status:prior?prior.status:'待處理',importance:d.get('importance'),created:Date.now()};if(id){const i=records.findIndex(r=>r.id===id);if(i<0||records[i].owner!==role){toast('無權修改此紀錄');return}records[i]=item;delete f.dataset.editing;document.getElementById('form-title').textContent='新增紀錄'}else records.unshift(item);save();f.reset();f.elements.date.value=today();syncInquiryFields(f);f.querySelector('[type=submit]').textContent='儲存測試紀錄';render();toast('測試紀錄已儲存')});
render();
})();
</script></body></html>
